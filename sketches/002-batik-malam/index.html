<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kabar Rimba — Batik Malam</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Sora:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#101a12; --night-2:#16241a; --panel:#1c2e20;
  --ivory:#ede4cf; --ivory-dim:#b9ae90; --gold:#c9a24b; --gold-dim:#8a7136;
  --ember:#cf6b3f; --line:#2c4232;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--night);color:var(--ivory);font-family:Sora,sans-serif;line-height:1.6;font-size:15px}
a{color:inherit}

/* kawung batik field */
.kawung{position:fixed;inset:0;z-index:0;opacity:.05;pointer-events:none}
.wrap{position:relative;z-index:1}

header{max-width:1080px;margin:0 auto;padding:58px 28px 30px;display:grid;grid-template-columns:1fr auto;gap:30px;align-items:end;border-bottom:1px solid var(--line)}
.brand{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:clamp(38px,6vw,58px);line-height:1.02;color:var(--ivory)}
.brand em{font-style:italic;color:var(--gold)}
.sub{margin-top:12px;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--ivory-dim)}
.cendrawasih{color:var(--gold);flex:none}

nav{max-width:1080px;margin:0 auto;padding:0 28px;display:flex;gap:26px;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;color:var(--ivory-dim);font-family:Sora,sans-serif;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:16px 2px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
nav button:hover{color:var(--ivory)}
nav button.on{color:var(--gold);border-bottom-color:var(--gold)}

main{max-width:1080px;margin:0 auto;padding:40px 28px 90px;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.card{background:var(--night-2);padding:26px 24px 22px;display:flex;flex-direction:column;gap:12px;transition:background .18s}
.card:hover{background:var(--panel)}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cat{font-size:10.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase}
.cat.kekayaan{color:var(--gold)} .cat.ancaman{color:var(--ember)} .cat.konservasi{color:#9dbb7e}
.card .orn{color:var(--gold-dim)}
.card h3{font-family:"Cormorant Garamond",serif;font-size:23px;font-weight:600;line-height:1.22;text-wrap:pretty;flex:1}
.card h3 a{text-decoration:none}
.card h3 a:hover{color:var(--gold)}
.card .meta{font-size:12px;color:var(--ivory-dim);letter-spacing:.04em;padding-top:12px;border-top:1px solid var(--line)}
.card .meta b{color:var(--ivory);font-weight:600}
footer{border-top:1px solid var(--line)}
.foot{max-width:1080px;margin:0 auto;padding:30px 28px;display:flex;justify-content:space-between;gap:20px;font-size:12.5px;color:var(--ivory-dim)}
@media(max-width:640px){header{grid-template-columns:1fr}.cendrawasih{display:none}nav{overflow-x:auto}}
</style>
</head>
<body>

<svg class="kawung" width="100%" height="100%" aria-hidden="true">
  <defs><pattern id="kw" width="72" height="72" patternUnits="userSpaceOnUse">
    <g fill="none" stroke="#c9a24b" stroke-width="1.1">
      <ellipse cx="36" cy="10" rx="11" ry="17" transform="rotate(0 36 10)"/>
      <ellipse cx="36" cy="62" rx="11" ry="17"/>
      <ellipse cx="10" cy="36" rx="17" ry="11"/>
      <ellipse cx="62" cy="36" rx="17" ry="11"/>
      <circle cx="36" cy="36" r="3"/>
    </g>
  </pattern></defs>
  <rect width="100%" height="100%" fill="url(#kw)"/>
</svg>

<div class="wrap">
<header>
  <div>
    <h1 class="brand">Rimba <em>Kabar</em></h1>
    <p class="sub">Kronik Hayati Nusantara — Edisi Malam</p>
  </div>
  <!-- cendrawasih (bird of paradise) -->
  <svg class="cendrawasih" width="150" height="110" viewBox="0 0 150 110" aria-hidden="true">
    <g fill="currentColor">
      <path d="M62 38 C66 30 76 26 84 30 C90 33 92 40 89 46 C86 52 78 54 72 51 C66 48 60 44 62 38 Z"/>
      <path d="M84 30 C90 24 100 22 106 26 L96 32 C92 34 88 33 84 30 Z"/>
      <circle cx="97" cy="29" r="1.8" fill="#101a12"/>
      <path d="M72 51 C60 60 42 62 28 58 C42 68 60 68 72 60 Z" opacity=".85"/>
      <path d="M70 52 C55 70 35 80 12 80 C34 88 58 80 72 62 Z" opacity=".6"/>
      <path d="M74 54 C68 76 52 92 30 100 C56 98 74 84 80 62 Z" opacity=".4"/>
      <path d="M89 46 C98 52 104 62 104 74 C110 62 106 50 96 43 Z" opacity=".7"/>
    </g>
  </svg>
</header>

<nav id="nav">
  <button class="on" data-c="all">Semua</button>
  <button data-c="kekayaan">Kekayaan</button>
  <button data-c="ancaman">Ancaman</button>
  <button data-c="konservasi">Konservasi</button>
</nav>

<main id="list"></main>

<footer><div class="foot">
  <span>Kabar Rimba — tautan menuju penerbit aslinya.</span>
  <span>Sketsa 002 · Batik Malam</span>
</div></footer>
</div>

<script>
const MON=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
let DATA=[],cat="all";
fetch("../sample.json").then(r=>r.json()).then(d=>{DATA=d;render()});
function fd(iso){const[y,m,dd]=iso.split("-");return`${+dd} ${MON[+m-1]} ${y}`}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const ORN=`<svg class="orn" width="34" height="10" viewBox="0 0 34 10" aria-hidden="true"><path d="M1,5 h8 M25,5 h8" stroke="currentColor" stroke-width="1"/><path d="M17,1 C20,3 20,7 17,9 C14,7 14,3 17,1 Z" fill="currentColor"/></svg>`;
function render(){
  const items=DATA.filter(x=>cat==="all"||x.category===cat);
  document.getElementById("list").innerHTML=items.map(it=>`
    <div class="card">
      <div class="top"><span class="cat ${it.category}">${it.category}</span>${ORN}</div>
      <h3><a href="${it.link}" target="_blank" rel="noopener">${esc(it.title)}</a></h3>
      <p class="meta">${it.source?`<b>${esc(it.source)}</b> — `:""}${fd(it.date)}</p>
    </div>`).join("");
}
document.getElementById("nav").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("#nav button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");cat=b.dataset.c;render();
});
</script>
</body>
</html>
